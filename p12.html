<!DOCTYPE html>
<head>
    <title>Project Gallery</title>
    <style>
        body {
    margin: 0;
    font-family: sans-serif;
    background: black;
    color: white;
}

main {
    padding: 40px;
}

h1 {
    color: rgb(234, 11, 97);
}

.grid {
    display:grid;
    grid-template-columns: repeat(3 , 1fr);
    grid-auto-rows: minmax(180px, auto);
    gap: 20px;
}

.project {
    background: rgb(13, 125, 177);
    border-radius: 10px;
    padding: 20px;
}

.featured {
    grid-column: span 2;
    grid-row: span 2;
}

@media (max-width: 800px) {
    .grid {
        grid-template-columns: repeat(2 , 1fr);
    }
}

@media (max-width: 500px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .featured {
        grid-column: span 1;
        grid-row: span 1;
    }
}
    </style>

    
</head>
<body>

<main>
    <h1>My Project Gallery</h1>

    <section class="grid">

        <article class="project featured">
            <h2>Personal Portfolio</h2>
            <p>A personal website built using HTML and CSS.</p>
        </article>

        <article class="project">
            <h2>Web Design</h2>
            <p>Modern website layouts.</p>
        </article>

        <article class="project">
            <h2>Java Practice</h2>
            <p>Programming exercises.</p>
        </article>

        <article class="project">
            <h2>AI Learning</h2>
            <p>Exploring Python and AI concepts.</p>
        </article>

        <article class="project">
            <h2>Study Dashboard</h2>
            <p>A concept for managing study tasks.</p>
        </article>

    </section>
</main>

</body>
</html>
