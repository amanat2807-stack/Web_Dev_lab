<!DOCTYPE html>
<head>
<title>Sticky Navbar</title>
<style>
    body{
    margin: 0;
    font-family: sans-serif;
    background: black;
    color: white;
}

.navbar{
    position: sticky;
    top: 0;
    background: rgb(235, 212, 5);
    padding: 15px 30px;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a{
    color: white;
    margin: 10px;
    text-decoration: none;
}

hero{
    height: 400px;
    padding: 30px;
    background: rgb(84, 5, 103);
}

.card {
    position: relative;
    width: 60%;
    margin: -60px auto0;
    padding: 30px;
    background: #34495e;
    color: white;
    border-radius: 12px;
    z-index: 2;
}

.extra {
    padding: 150px 30px;
}
</style>
   
</head>
<body>

    <header class="navbar">
        <h2>Amanat portfolio</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h1>Welcome to My Portfolio</h1>
            <p>Creative ideas and modern development.</p>
        </section>

        <article class="card" id="about">
            <h2>About My Work</h2>
            <p>I enjoy learning web development and creating projects.</p>

        </article>

        <section class="extra">
            <h2>More Information</h2>
            <p>Scroll down to see more details about my work.</p>
        </section>
    </main>
    
</body>
</html>
